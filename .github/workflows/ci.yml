name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          brew install swiftlint swiftformat
      - name: SwiftFormat
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --quiet

  generate-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Tuist
        run: brew install tuist
      - name: Generate Xcode workspace
        run: tuist generate --no-open
      - name: Run package tests
        env:
          IOS_SIMULATOR_NAME: iPhone 16
        run: ./scripts/test.sh
      - name: Run iOS app tests
        env:
          IOS_SIMULATOR_NAME: iPhone 16
        run: ./scripts/test_apps.sh
      - name: Build iOS apps
        run: ./scripts/build_apps.sh
